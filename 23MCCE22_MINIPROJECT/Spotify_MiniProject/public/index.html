<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify</title>
  <link rel="icon" type="image/png" href="/img/spotify_logo.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="auth">
    <div class="box">
      <h1 class="brand"><img src="/img/spotify_logo.png" alt="Spotify" class="logo-img">Spotify</h1>
      <p class="tag">Stream Hindi, English &amp; Telugu songs — distributed over socket-connected server nodes.</p>
      <div class="tabs">
        <button id="tab-login" class="on" onclick="setMode('login')">Log In</button>
        <button id="tab-signup" onclick="setMode('signup')">Sign Up</button>
      </div>
      <input id="ae" type="email" placeholder="Email" autocomplete="email">
      <input id="au" type="text" placeholder="Username" autocomplete="off">
      <input id="ap" type="password" placeholder="Password">
      <div id="aerr"></div>
      <button id="abtn" class="big" onclick="submitAuth()">Log In</button>
    </div>
  </div>

  <div id="app">
    <nav id="side">
      <h1 class="brand"><img src="/img/spotify_logo.png" alt="" class="logo-img side"> Spotify</h1>
      <a data-v="home" class="on">🏠 Home</a>
      <a data-v="search">🔍 Search</a>
      <a data-v="library">📚 Library</a>
      <a data-v="playlists">🎶 Playlists</a>
      <a data-v="songs">🎵 All Songs</a>
      <div id="nodes"></div>
      <div id="who"></div>
      <button id="logout" onclick="logout()">🚪 Log out</button>
      <button id="crash">💥 Crash last node</button>
    </nav>
    <main>
      <div id="msg"></div>
      <div id="view"></div>
    </main>
  </div>

  <footer id="player">
    <div id="pcover">♪</div>
    <div id="info"><b id="ptitle">Nothing playing</b><small id="partist">Pick a song ▶</small></div>
    <div id="ctrl">
      <button onclick="prev()">⏮</button>
      <button id="pp" onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
      <input id="bar" type="range" min="0" max="100" value="0">
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
